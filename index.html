<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta charset="UTF-8">
  <title>Redirecting...</title>
<meta http-equiv="refresh" content="0; url=https://apps.chandas.in/" />
<style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: lightgrey;
      font-family: Arial, sans-serif;
    }
    .button {
      padding: 15px 30px;
      font-size: 18px;
      color: #fff;
      background: azure;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: background 0.3s ease;
    }
    .button:hover {
      background: floralwhite;
    }
	.title {
    font-size: min(8vw, 8vh);
    background: linear-gradient(0deg, rgb(255, 0, 254, 1) 0%, rgb(255, 0, 254, 1) 20%, rgb(0, 255, 1, 1) 40%, rgb(255, 0, 254, 1) 50%, rgb(255, 0, 254, 1) 80%, rgb(255, 0, 254, 1) 100%);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
}
.subtitle {
    font-size: min(6vw, 6vh);
    background: linear-gradient(0deg, rgb(255, 0, 254, 1) 0%, rgb(255, 0, 254, 1) 20%, rgb(0, 255, 1, 1) 40%, rgb(255, 0, 254, 1) 50%, rgb(255, 0, 254, 1) 80%, rgb(255, 0, 254, 1) 100%);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    opacity: 50%;
}
  </style>
</head>
<body>
  <a href="https://apps.chandas.in" class="button"><span class="title">Chandas Apps</span></a>
</body>
</html>
